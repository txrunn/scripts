<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scripts</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f5f3; --ink: #16150f; --muted: #6d6a61;
  --line: #e2ded6; --accent: #b4441f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131211; --ink: #ece9e2; --muted: #97928a;
    --line: #2c2a27; --accent: #e0713f;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center;
  font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
main { padding: 32px; max-width: 34rem; width: 100%; }
h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.02em; }
.lede { color: var(--muted); margin: 0 0 26px; }
a { color: var(--accent); }
ul { list-style: none; margin: 0; padding: 0; }
li { border-top: 1px solid var(--line); }
li:last-child { border-bottom: 1px solid var(--line); }
li a.row {
  display: block; padding: 14px 0; color: inherit; text-decoration: none;
}
li a.row:hover .t { color: var(--accent); }
.t { font-weight: 600; }
.d { color: var(--muted); font-size: 13.5px; }
</style>
</head>
<body>
<main>
  <h1>scripts</h1>
  <p class="lede">General scripts for various annoyances —
     <a href="https://github.com/txrunn/scripts">source on GitHub</a>.</p>
  <ul>
    <li><a class="row" href="alamo/">
      <div class="t">Alamo Bryant Street</div>
      <div class="d">What is bookable now, and when each title turned up</div>
    </a></li>
    <li><a class="row" href="blu-ray-discs/">
      <div class="t">4K disc inventory</div>
      <div class="d">The physical media shelf</div>
    </a></li>
  </ul>
</main>
</body>
</html>
