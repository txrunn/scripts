# Manual fields, keyed by the exact line you wrote in collection.txt.
#
# Everything here wins over the looked-up metadata and is never overwritten by a
# rebuild, so this is where anything the APIs cannot tell us lives:
#
#   rt_audience   Rotten Tomatoes audience score. No free API exposes this --
#                 OMDb's Ratings array carries the Tomatometer only -- so it
#                 stays blank unless you put it here. Worth filling in for the
#                 films where it disagrees with the critics, which on this shelf
#                 is most of the horror (Hereditary is 91/56).
#   rt_critic     Override the OMDb Tomatometer, if it is missing or wrong.
#   theatrical_score  Deliberately unsourced. Yours to define; blank otherwise.
#   hdr           "HDR10", "Dolby Vision", "HDR10+", "HDR10 / Dolby Vision"
#   uhd           true if you own it on 4K UHD, false for a 1080p Blu-ray.
#   uhd_year      Year of the disc release, kept separate from the film's year.
#   disc_notes    Steelbook, slipcover, region, commentary -- free text.
#   title         Force the display title if TMDB's differs from the packaging.
#   tmdb_id       Pin the match if the search picks the wrong film.
#
# Example -- delete or edit freely:
#
# ["Hereditary"]
# rt_audience = 56
# hdr = "HDR10"
# disc_notes = "A24 slipcover"

["The Witch (2015)"]
rt_audience = 60

["Hereditary"]
rt_audience = 56

# TMDB search found a French film called "Spiral" (Sofiene Mamdi) rather than
# Spiral: From the Book of Saw. Pinning the id is the fix; the year hint alone
# cannot separate two 2021 films with the same title.
["Spiral (2021)"]
tmdb_id = 602734

# The right film -- TMDB just files Nakata's 1998 original under its
# international title, "Ring".
["Ringu"]
title = "Ringu"

# The box is labelled "Naoki Urasawa's Monster: Collection 1"; TMDB files the
# series as plain "Monster", which a title search will not reach past the
# publisher's name and the volume number. Pinned, and the disc note records
# which half of the run is actually on the shelf.
["Naoki Urasawa's Monster: Collection 1"]
tmdb_id = 30981
disc_notes = "Collection 1 of 2 (Blu-ray)"

# Nature series, 2019. Pinned so a future TMDB title collision cannot move it.
["Seven Worlds, One Planet"]
tmdb_id = 90790
