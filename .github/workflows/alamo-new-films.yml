name: Alamo new films

# Checks daily for movies that have newly gone on sale at DC Bryant Street and
# opens an issue when there are any. GitHub emails you about issues in your own
# repo, so no SMTP secrets are needed.
#
# For a push on your phone on top of that email, set an NTFY_URL repo secret
# (see the README). The notification is sent by this job with a plain curl
# rather than by GitHub, so it survives a move to Forgejo, GitLab, or a cron
# box unchanged -- only the secret has to come with it.
#
# The ledger lives in the repo at alamo-drafthouse/ci-state/ and is committed
# back on days something is added -- runners are ephemeral, so state has to
# persist somewhere, and the repo doubles as an audit trail of what appeared
# when. It is deliberately NOT alamo-drafthouse/state/, which is gitignored for
# local runs; the two ledgers are independent.

on:
  schedule:
    # 13:00 UTC = 9am EDT / 8am EST. GitHub cron is always UTC and does not
    # follow DST, so this drifts by an hour in winter.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Open a test issue from the current slate (ledger untouched)"
        type: boolean
        default: false

concurrency:
  group: alamo-new-films
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  bryant-street:
    name: DC Bryant Street
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Guards against a bad commit reaching a scheduled run, where a silent
      # mis-report looks exactly like a quiet day.
      - name: Run tests
        run: python -m unittest discover -s alamo-drafthouse -t alamo-drafthouse

      # One fetch, reused below. --verify fails the job if Alamo changes the
      # API, which is the early warning that the parser needs attention -- far
      # better than a run that quietly reports nothing forever.
      - name: Fetch schedule and check the API contract
        run: |
          set -o pipefail
          python alamo-drafthouse/alamo_new_films.py \
            --verify --dump "$RUNNER_TEMP/raw.json" | tee "$RUNNER_TEMP/verify.txt"

      - name: Find newly bookable films
        run: |
          set -o pipefail
          # test_alert reports the whole current slate against a throwaway
          # ledger, so the alert path can be exercised on demand without
          # waiting for Alamo to add something. The real ledger is not read
          # or written, so a test cannot cause a genuine addition to be missed.
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            STATE="$RUNNER_TEMP/test-ledger.json"
            FORCE="--force-report"
            echo "TEST ALERT: reporting the current slate; the real ledger is untouched."
          else
            STATE="alamo-drafthouse/ci-state/dc-bryant-street.json"
            FORCE=""
          fi
          python alamo-drafthouse/alamo_new_films.py \
            --from-file "$RUNNER_TEMP/raw.json" \
            --state "$STATE" $FORCE \
            --report-dir "$RUNNER_TEMP/reports" \
            --format markdown | tee "$RUNNER_TEMP/report.md"
          # The report is empty on a quiet day, which would leave this step
          # blank in the log -- indistinguishable from a step that did nothing.
          [ -s "$RUNNER_TEMP/report.md" ] || echo "No new films since the last run."

      - name: Decide whether to alert
        id: detect
        run: |
          if compgen -G "$RUNNER_TEMP/reports/*.json" > /dev/null; then
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "New films found -- will open an issue and commit the ledger."
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new -- no issue, no commit."
          fi

      - name: Write the run summary
        if: always()
        run: |
          # A quiet run should still say what it saw. "Nothing new" alone
          # cannot be told apart from a run that silently stopped working.
          STATS=$(sed -n 's/^upcoming bookable sessions at target *PASS *//p' "$RUNNER_TEMP/verify.txt" 2>/dev/null)
          WINDOW=$(sed -n 's/^schedule window *INFO *//p' "$RUNNER_TEMP/verify.txt" 2>/dev/null)
          TIERS=$(sed -n 's/^event classification *INFO *//p' "$RUNNER_TEMP/verify.txt" 2>/dev/null)
          {
            if [ "${{ steps.detect.outputs.new }}" = "true" ]; then
              echo "## New films at DC Bryant Street"
              echo
              cat "$RUNNER_TEMP/report.md"
              echo
              echo "---"
            else
              echo "## Nothing new today"
              echo
            fi
            if [ -n "$STATS" ]; then
              echo "Currently tracking **${STATS}** at DC Bryant Street."
              echo
              echo "- Schedule window: ${WINDOW:-unknown}"
              echo "- Mix: ${TIERS:-unknown}"
            else
              echo "> The API check did not complete, so no counts are available."
            fi
            echo
            echo "<details><summary>Full API contract check</summary>"
            echo
            echo '```'
            cat "$RUNNER_TEMP/verify.txt" 2>/dev/null || echo "(verify did not run)"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue for the new films
        id: issue
        if: steps.detect.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat "$RUNNER_TEMP/report.md"
            echo
            echo "---"
            echo
            echo "<sub>Opened by the <a href=\"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\">alamo-new-films</a> workflow."
            echo "Close this whenever — the tracker uses its own ledger, so nothing here is re-reported either way.</sub>"
          } > "$RUNNER_TEMP/issue.md"
          # Lead the title with the special-event count -- that is the part
          # worth opening the email for.
          TITLE=$(python - "$RUNNER_TEMP"/reports/*.json <<'PY'
          import json, sys
          films = json.load(open(sys.argv[1]))["films"]
          events = sum(1 for f in films if f["tier"] == "event")
          bits = []
          if events:
              bits.append(f"{events} special event" + ("s" if events != 1 else ""))
          rest = len(films) - events
          if rest:
              bits.append(f"{rest} other" + ("s" if rest != 1 else ""))
          print(("New at Bryant Street: " + ", ".join(bits)))
          PY
          )
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            TITLE="[test] $TITLE"
            sed -i '1i > **This is a test alert.** It lists the whole current slate rather than\n> anything newly added, and the tracker'"'"'s ledger was not touched. Safe to close.\n' \
              "$RUNNER_TEMP/issue.md"
          fi
          # The URL and title feed the phone push below. tail -n1 because on
          # the fallback path both invocations write to stdout.
          URL=$({ gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md" --label alamo \
            || gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md"; } | tail -n 1)
          echo "$URL"
          {
            echo "url=$URL"
            echo "title=$TITLE"
          } >> "$GITHUB_OUTPUT"

      # Only on days something was added: the ledger's `seen` map is unchanged
      # otherwise, and a daily no-op commit would bury real history.
      - name: Commit the updated ledger
        if: steps.detect.outputs.new == 'true' && inputs.test_alert != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alamo-drafthouse/ci-state/dc-bryant-street.json
          if git diff --cached --quiet; then
            echo "ledger unchanged, nothing to commit"
          else
            git commit -m "Record new Bryant Street films seen on $(date -u +%Y-%m-%d)"
            git push
          fi

      # Last, deliberately. The issue is already open and the ledger has already
      # advanced, so a notifier outage cannot strand state or make tomorrow
      # re-report today's films. It turns the run red instead, and GitHub emails
      # you about failed runs -- a push that quietly stops working is the exact
      # silent failure the rest of this workflow is built to avoid.
      #
      # NTFY_URL is the whole topic URL, e.g. https://ntfy.sh/<your-topic>.
      # NTFY_TOKEN is optional and only matters against a self-hosted server
      # with auth on, so that moving off ntfy.sh stays a change to secrets
      # rather than a change to this file.
      #
      # Nothing below is GitHub-specific past the two step outputs: on another
      # forge this is the same curl against the same secrets.
      - name: Push a phone notification
        if: steps.detect.outputs.new == 'true'
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
        run: |
          if [ -z "$NTFY_URL" ]; then
            echo "No NTFY_URL secret set -- skipping the push. The issue was still opened."
            exit 0
          fi
          # Writes the notification body and the buttons, prints the priority.
          PRIORITY=$(python - "$RUNNER_TEMP"/reports/*.json <<'PY'
          import json, os, re, sys, unicodedata

          films = json.load(open(sys.argv[1]))["films"]
          tmp = os.environ["RUNNER_TEMP"]

          # The titles are the whole point of the notification: they are what
          # lets you decide from the lock screen whether this is worth acting
          # on. Capped at ten because nobody reads a 60-line notification and
          # ntfy turns a body over 4KB into an attachment -- which a
          # --force-report run over the whole slate would trip. Films arrive
          # sorted by tier, so special events survive the cut.
          #
          # One title per line, no bullet, no padding. ntfy renders Markdown in
          # the web app only, so on a phone a "- " prefix is a literal hyphen
          # rather than a list, and iOS shows about four lines before it
          # truncates -- every character spent on decoration is a character of
          # film title that wraps or vanishes.
          LIMIT = 10
          with open(os.path.join(tmp, "push.txt"), "w", encoding="utf-8", newline="\n") as out:
              for film in films[:LIMIT]:
                  label = film["event_label"]
                  out.write(film["title"] + (f" ({label})" if label else "") + "\n")
              if len(films) > LIMIT:
                  out.write(f"+{len(films) - LIMIT} more\n")

          def button_label(title):
              # Header values are ASCII, ntfy splits actions on , and ;, and the
              # button is only a few characters wide -- so fold, strip, clip.
              flat = unicodedata.normalize("NFKD", title).encode("ascii", "ignore").decode()
              flat = re.sub(r'["\\,;]', "", flat)
              flat = re.sub(r"\s+", " ", flat).strip()  # folding a dash leaves a gap
              if len(flat) > 27:
                  flat = flat[:24].rstrip() + "..."
              return flat or "Showtimes"

          # ntfy allows three. Tapping the notification itself opens the issue;
          # these skip that hop and go straight to booking. One new film needs
          # no disambiguating, so it gets the plainer label.
          picks = films[:3]
          with open(os.path.join(tmp, "actions.txt"), "w", encoding="utf-8", newline="\n") as out:
              out.write("; ".join(
                  'view, "%s", %s' % (
                      "Showtimes" if len(films) == 1 else button_label(film["title"]),
                      film["url"],
                  )
                  for film in picks
              ))

          # Special events are the ones that sell out. The rest can wait for a
          # badge instead of interrupting whatever you are doing.
          print("high" if any(f["tier"] == "event" for f in films) else "default")
          PY
          )
          # Only needed once you self-host with auth turned on -- ntfy.sh
          # public topics take an unauthenticated publish, so the secret is
          # absent until the day it isn't and this stays an empty array.
          AUTH=()
          if [ -n "$NTFY_TOKEN" ]; then
            AUTH=(-H "Authorization: Bearer $NTFY_TOKEN")
          fi
          curl --fail --silent --show-error \
            "${AUTH[@]}" \
            -H "Title: $ISSUE_TITLE" \
            -H "Priority: $PRIORITY" \
            -H "Tags: clapper" \
            -H "Click: $ISSUE_URL" \
            -H "Actions: $(cat "$RUNNER_TEMP/actions.txt")" \
            --data-binary @"$RUNNER_TEMP/push.txt" \
            "$NTFY_URL"
